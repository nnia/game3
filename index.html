<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height="device-height", initial-scale=1.0">
    <link rel="icon" href="ks.png" sizes="32x32" type="image/png">
    <title>Get the checksum!</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: clip;
        }
        .game-container {
            align-items: center;
            justify-content: center;
            text-align: center;
            position: static;
            align-items: center;
        }
        h1 {
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00f2fe;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .ks-board {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #a0aec0;
        }
        #ks {
            font-weight: bold;
            color: #22ff77;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
        }
        canvas {
            align-items: center;
            justify-content: center;
            background: #dd1827;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 
                        0 0 30px rgba(79, 172, 254, 0.15);
            border: 2px solid #1f2937;
        }
    </style>
</head>
<body>
        <div class="game-container">
        <div class="ks-board">Контрольная сумма: <span id="ks"></span></div>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
    </div>
<script src="game3.js"></script>
</body>
